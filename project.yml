name: AppCards
options:
  bundleIdPrefix: com.imsoft
  developmentLanguage: es
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_TEAM: D3734A3AQY
    CODE_SIGN_STYLE: Automatic
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.5.0
targets:
  AppCards:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Supabase.xcconfig
      Release: Config/Supabase.xcconfig
    dependencies:
      - package: Supabase
        product: Supabase
    sources:
      - path: AppCards
    info:
      path: AppCards/Info.plist
      properties:
        CFBundleDisplayName: Vault
        CFBundleURLTypes:
          - CFBundleURLName: com.imsoft.appcards.auth
            CFBundleURLSchemes: [imsoft-vault]
        CFBundleDevelopmentRegion: es
        CFBundleLocalizations: [es]
        CFBundleAllowMixedLocalizations: true
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.imsoft.appcards.refresh]
        SupabaseScheme: $(SUPABASE_SCHEME)
        SupabaseHost: $(SUPABASE_HOST)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
        NSCameraUsageDescription: Para leer el número o nombre de la carta y buscar su precio.
        NSPhotoLibraryAddUsageDescription: Para guardar en tus fotos la imagen de un deck que quieras compartir.
    # iCloud desactivado: el Personal Team gratuito no permite CloudKit.
    # Para activarlo con una cuenta de paga, restaura este bloque:
    # entitlements:
    #   path: AppCards/AppCards.entitlements
    #   properties:
    #     com.apple.developer.icloud-container-identifiers: [iCloud.com.imsoft.appcards]
    #     com.apple.developer.icloud-services: [CloudKit]
    #     aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.imsoft.appcards
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: true
  AppCardsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AppCardsTests
    dependencies:
      - target: AppCards
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.imsoft.appcards.tests
        GENERATE_INFOPLIST_FILE: YES
  AppCardsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AppCardsUITests
    dependencies:
      - target: AppCards
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.imsoft.appcards.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: AppCards
schemes:
  AppCards:
    build:
      targets:
        AppCards: all
        AppCardsTests: [test]
        AppCardsUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AppCardsTests
        - AppCardsUITests
